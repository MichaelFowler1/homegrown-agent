<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- card background (opaque, so it reads the same on light or dark GitHub) -->
  <rect x="0" y="0" width="920" height="560" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="919" height="559" rx="16" fill="none" stroke="#30363d"/>

  <text x="460" y="42" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="700">Local Autonomous Agent — the loop</text>
  <text x="460" y="68" text-anchor="middle" fill="#8b949e" font-size="14">the model generates; the scaffolding decides, runs, judges, and contains</text>

  <!-- arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- 1 PONDER -->
  <rect x="40" y="110" width="150" height="70" rx="10" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="115" y="140" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">1 · PONDER</text>
  <text x="115" y="160" text-anchor="middle" fill="#8b949e" font-size="11.5">picks its own goal</text>

  <!-- 2 WRITE -->
  <rect x="230" y="110" width="150" height="70" rx="10" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="305" y="140" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">2 · WRITE</text>
  <text x="305" y="160" text-anchor="middle" fill="#8b949e" font-size="11.5">run.sh (shell script)</text>

  <!-- 3 SANDBOX -->
  <rect x="420" y="96" width="230" height="150" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="535" y="122" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="700">3 · SANDBOX (Docker)</text>
  <text x="535" y="146" text-anchor="middle" fill="#e6edf3" font-size="12">runs the code, disposable</text>
  <line x1="440" y1="158" x2="630" y2="158" stroke="#30363d"/>
  <text x="535" y="177" text-anchor="middle" fill="#8b949e" font-size="11">🚫 no network (until granted)</text>
  <text x="535" y="195" text-anchor="middle" fill="#8b949e" font-size="11">🔒 host files unreachable</text>
  <text x="535" y="213" text-anchor="middle" fill="#8b949e" font-size="11">⏱ cpu / mem / time capped</text>
  <text x="535" y="231" text-anchor="middle" fill="#8b949e" font-size="11">📁 /project persists · /out artifacts</text>

  <!-- 4 READ -->
  <rect x="690" y="110" width="150" height="70" rx="10" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="765" y="140" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">4 · READ</text>
  <text x="765" y="160" text-anchor="middle" fill="#8b949e" font-size="11.5">real output / errors</text>

  <!-- 5 JUDGE -->
  <rect x="690" y="300" width="150" height="72" rx="10" fill="#1f2937" stroke="#d29922" stroke-width="1.5"/>
  <text x="765" y="330" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">5 · JUDGE</text>
  <text x="765" y="350" text-anchor="middle" fill="#8b949e" font-size="11.5">strict · goal fully met?</text>

  <!-- DONE -->
  <rect x="690" y="440" width="150" height="60" rx="10" fill="#132a17" stroke="#3fb950" stroke-width="1.5"/>
  <text x="765" y="470" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">✓ DONE</text>
  <text x="765" y="488" text-anchor="middle" fill="#8b949e" font-size="11">artifact in /out</text>

  <!-- FIXER -->
  <rect x="360" y="300" width="190" height="72" rx="10" fill="#2b1d10" stroke="#f0883e" stroke-width="1.5"/>
  <text x="455" y="328" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="600">SENIOR FIXER</text>
  <text x="455" y="348" text-anchor="middle" fill="#8b949e" font-size="11">stuck 2×? rewrite from scratch</text>

  <!-- POWER GATE -->
  <rect x="40" y="300" width="270" height="72" rx="10" fill="#221a2e" stroke="#a371f7" stroke-width="1.5"/>
  <text x="175" y="328" text-anchor="middle" fill="#a371f7" font-size="14" font-weight="600">POWER GATE — human approves</text>
  <text x="175" y="348" text-anchor="middle" fill="#8b949e" font-size="11">network · packages · languages · time (y/n)</text>

  <!-- flow arrows -->
  <line x1="190" y1="145" x2="226" y2="145" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="380" y1="145" x2="416" y2="150" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="650" y1="150" x2="686" y2="145" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="765" y1="180" x2="765" y2="296" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- judge yes -> done -->
  <line x1="765" y1="372" x2="765" y2="436" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="778" y="410" fill="#3fb950" font-size="12" font-weight="600">yes</text>
  <!-- judge no -> back up to ponder (big loop across bottom then up left) -->
  <path d="M690,336 L175,336" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M175,300 L175,190 Q175,145 190,145 L226,145" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="600" y="330" fill="#8b949e" font-size="12" font-weight="600">no → iterate</text>
  <!-- fixer feeds write -->
  <path d="M455,300 L455,190 Q455,182 448,182 L385,175" fill="none" stroke="#f0883e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <!-- power gate feeds ponder/write region -->
  <path d="M175,300 L175,182" fill="none" stroke="#a371f7" stroke-width="1.2" stroke-dasharray="3 4"/>

  <text x="460" y="540" text-anchor="middle" fill="#6e7681" font-size="12">worker · judge · fixer = a local 14B (fits a 10GB GPU) or a free cloud 70B</text>
</svg>
